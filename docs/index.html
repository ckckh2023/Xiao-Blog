<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ckckh2023 - 文档</title>
  <meta name="description" content="ckckh2023 的 文档库目录">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/docs.css">
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/ckckh2023">
  <link rel="canonical" href="https://xiao-blog.top/docs/index.html">
  <meta property="og:site_name" content="ckckh2023 文档">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="ckckh2023 - 文档">
  <meta property="og:description" content="ckckh2023 的 文档库目录">
  <meta property="og:url" content="https://xiao-blog.top/docs/index.html">
  <meta property="og:image" content="https://avatars.githubusercontent.com/ckckh2023">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ckckh2023 - 文档">
  <meta name="twitter:description" content="ckckh2023 的 文档库目录">
  <meta name="twitter:image" content="https://avatars.githubusercontent.com/ckckh2023">
</head>
<body>
  <header id="site-nav"></header>

  <div class="docs-layout">
    <!-- 左侧目录侧边栏（common.js 渲染） -->
    <aside id="docs-sidebar" class="docs-sidebar">
      <h3>目录</h3>
      <div class="status-box">加载中…</div>
    </aside>

    <!-- 右侧内容 -->
    <section class="docs-content">
      <div class="docs-head-row">
        <h1>文档知识库</h1>
        <div id="docs-search"></div>
      </div>
      <p>这里收录我在开发过程中整理的笔记与经验，点击左侧目录或下方列表即可阅读。</p>

      <div class="section-title" style="margin-top: 24px;">
        <span>全部文章</span>
      </div>
      <div id="docs-index-list" class="docs-index-list">
        <div class="status-box">加载中…</div>
      </div>
    </section>
  </div>

  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by Cloudflare Pages
  </footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/docs.js"></script>
  <script>
    /* 渲染左侧侧边栏（目录页无当前文章） */
    renderSidebar(null);

    /* 渲染右侧文章列表（仅一级：有子章节的跳第一个叶子，否则跳自身）；
       搜索框对标题 / id 实时过滤 */
    var allDocs = [];

    function matchDoc(item, q) {
      if (!q) return true;
      var fields = [item.title, item.id];
      for (var i = 0; i < fields.length; i++) {
        if (fields[i] && String(fields[i]).toLowerCase().indexOf(q) !== -1) return true;
      }
      return false;
    }

    function renderDocsIndex(list, hasQuery) {
      var box = document.getElementById("docs-index-list");
      if (!list.length) {
        box.innerHTML = '<div class="status-box">' +
          (hasQuery ? "未找到匹配的文章。" : "暂无文章。") + "</div>";
        return;
      }
      box.innerHTML = list.map(function (item) {
        var href = (item.children && item.children.length)
          ? docHref(firstLeafIds(item, []))
          : docHref([item.id]);
        return '<a class="doc-item" href="' + href + '">' +
          '<span class="doc-title">' + Utils.escapeHTML(item.title) + "</span>" +
          '<span class="doc-arrow">→</span>' +
        "</a>";
      }).join("");
    }

    fetchDocsList().then(function (list) {
      allDocs = list;
      renderDocsIndex(allDocs, false);
      mountSearchBox("#docs-search", {
        placeholder: "搜索文章…",
        onQuery: function (q) {
          renderDocsIndex(allDocs.filter(function (it) { return matchDoc(it, q); }), !!q);
        }
      });
    });
  </script>
</body>
</html>
