<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ckckh2023 - Wiki</title>
  <meta name="description" content="ckckh2023 的 Wiki 知识库目录">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/ckckh2023">
</head>
<body>
  <header id="site-nav"></header>

  <div class="docs-layout">
    <!-- 左侧目录侧边栏（common.js 渲染） -->
    <aside id="docs-sidebar" class="docs-sidebar">
      <h3>目录</h3>
      <div class="status-box">加载中…</div>
    </aside>

    <!-- 右侧内容 -->
    <section class="docs-content">
      <h1>Wiki 知识库</h1>
      <p>这里收录我在开发过程中整理的笔记与经验，点击左侧目录或下方列表即可阅读。</p>

      <div class="section-title" style="margin-top: 24px;">
        <span>全部文章</span>
      </div>
      <div id="docs-index-list" class="docs-index-list">
        <div class="status-box">加载中…</div>
      </div>
    </section>
  </div>

  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by GitHub Pages
  </footer>

  <script src="/assets/js/common.js"></script>
  <script>
    /* 渲染左侧侧边栏（目录页无当前文章） */
    renderSidebar(null);

    /* 渲染右侧文章列表（支持嵌套：有 children 的一级展开为分组） */
    fetchDocsList().then(function (list) {
      var box = document.getElementById("docs-index-list");
      if (!list.length) {
        box.innerHTML = '<div class="status-box">暂无文章。</div>';
        return;
      }
      var html = "";
      list.forEach(function (item) {
        if (item.children && item.children.length) {
          /* 一级分组：标题跳第一个子章节，其下列出子项 */
          var firstHref = docHref(item.id, item.children[0].id);
          html += '<div class="doc-group">' +
            '<a class="doc-item doc-group-title" href="' + firstHref + '">' +
              '<span class="doc-title">' + Utils.escapeHTML(item.title) + "</span>" +
              '<span class="doc-arrow">→</span>' +
            "</a>" +
            '<div class="doc-sub-list">';
          item.children.forEach(function (c) {
            var href = docHref(item.id, c.id);
            html += '<a class="doc-item doc-sub-item" href="' + href + '">' +
              '<span class="doc-title">' + Utils.escapeHTML(c.title) + "</span>" +
              '<span class="doc-arrow">→</span>' +
            "</a>";
          });
          html += "</div></div>";
        } else {
          var href = docHref(item.id);
          html += '<a class="doc-item" href="' + href + '">' +
            '<span class="doc-title">' + Utils.escapeHTML(item.title) + "</span>" +
            '<span class="doc-arrow">→</span>' +
          "</a>";
        }
      });
      box.innerHTML = html;
    });
  </script>
</body>
</html>
