<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ckckh2023 - 首页</title>
  <meta name="description" content="ckckh2023 的个人博客 - 首页">
  <link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>
  <!-- 顶部导航栏（由 common.js 渲染） -->
  <header id="site-nav"></header>

  <main class="container">
    <!-- 个人信息区块 -->
    <section id="profile-section" class="profile-card">
      <img class="profile-avatar" id="profile-avatar"
           src="https://avatars.githubusercontent.com/ckckh2023"
           alt="avatar" onerror="this.style.visibility='hidden'">
      <div class="profile-info">
        <h1 id="profile-name">加载中…</h1>
        <div class="bio" id="profile-bio"></div>
        <div class="meta" id="profile-meta"></div>
      </div>
    </section>

    <!-- 精选项目区块（Vue 渲染） -->
    <section>
      <div class="section-title">
        <span>精选项目</span>
        <a class="more-link" href="/repo/index.html">查看全部项目 »</a>
      </div>
      <div id="featured-projects" class="project-grid">
        <!-- Vue 挂载点 -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by GitHub Pages
  </footer>

  <!-- 全局共享逻辑 -->
  <script src="/assets/js/common.js"></script>
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    /* 年份 */
    document.getElementById("year").textContent = new Date().getFullYear();

    /* 个人信息加载（带兜底） */
    fetchGitHubProfile().then(function (p) {
      document.getElementById("profile-name").textContent = p.name;
      document.getElementById("profile-bio").textContent = p.bio || "";
      var meta = [];
      if (p.company) meta.push("🏢 " + p.company);
      if (p.location) meta.push("📍 " + p.location);
      if (p.public_repos) meta.push("📦 " + p.public_repos + " repos");
      if (p.followers) meta.push("👥 " + p.followers + " followers");
      document.getElementById("profile-meta").innerHTML =
        meta.map(function (t) { return "<span>" + t + "</span>"; }).join("");
      if (p.avatar) {
        var av = document.getElementById("profile-avatar");
        av.src = p.avatar;
      }
    });

    /* Vue 渲染精选项目卡片 */
    var { createApp, h } = Vue;
    createApp({
      setup() {
        var projects = PROJECTS.slice(0, 2);
        return function () {
          return h("div", { class: "project-grid" },
            projects.map(function (p) {
              return h("article", { class: "card project-card", key: p.id }, [
                h("div", { class: "pc-title" }, p.name),
                h("div", { class: "pc-desc" }, p.desc),
                h("div", { class: "pc-tags" },
                  (p.tags || []).map(function (t) {
                    return h("span", { class: "pc-tag" }, t);
                  })
                ),
                h("div", { class: "pc-meta" }, [
                  h("span", { class: "star" }, "★ " + (p.stars || 0)),
                  h("span", "#" + p.id)
                ]),
                h("div", { class: "pc-actions" }, [
                  h("a", {
                    class: "btn btn-primary",
                    href: p.url,
                    target: "_blank",
                    rel: "noopener"
                  }, "访问"),
                  h("a", {
                    class: "btn",
                    href: p.repo,
                    target: "_blank",
                    rel: "noopener"
                  }, "源码")
                ])
              ]);
            })
          );
        };
      }
    }).mount("#featured-projects");
  </script>
</body>
</html>
