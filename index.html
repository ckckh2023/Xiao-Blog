<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ckckh2023 - 首页</title>
  <meta name="description" content="ckckh2023 的个人博客 - 首页">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="/assets/css/repo.css">
  <link rel="stylesheet" href="/assets/css/guestbook.css">
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/ckckh2023">
  <link rel="canonical" href="https://xiao-blog.top/">
  <meta property="og:site_name" content="ckckh2023">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="ckckh2023 - 首页">
  <meta property="og:description" content="ckckh2023 的个人博客 - 首页">
  <meta property="og:url" content="https://xiao-blog.top/">
  <meta property="og:image" content="https://avatars.githubusercontent.com/ckckh2023">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ckckh2023 - 首页">
  <meta name="twitter:description" content="ckckh2023 的个人博客 - 首页">
  <meta name="twitter:image" content="https://avatars.githubusercontent.com/ckckh2023">
</head>
<body>
  <!-- 顶部导航栏（由 common.js 渲染） -->
  <header id="site-nav"></header>

  <main class="container">
    <!-- 个人信息区块 -->
    <section id="profile-section" class="profile-card">
      <img class="profile-avatar" id="profile-avatar"
           src="https://avatars.githubusercontent.com/ckckh2023"
           alt="avatar" onerror="this.style.visibility='hidden'">
      <div class="profile-info">
        <div class="profile-name-wrapper">
			<h1 id="profile-name">加载中…</h1>
			<span class="handle-tag">@ckckh2023</span>
		</div>
        <div class="bio" id="profile-bio"></div>
        <div class="meta" id="profile-meta"></div>
      </div>
    </section>

    <!-- 精选项目区块（Vue 渲染） -->
    <section class="panel">
      <div class="section-title">
        <span>精选项目</span>
        <a class="more-link" href="/repo/index.html">查看全部项目 »</a>
      </div>
      <div id="featured-projects">
        <!-- Vue 挂载点（每行 2 个） -->
      </div>
    </section>

    <!-- 精选文档 区块 -->
    <section class="panel">
      <div class="section-title">
        <span>精选文档</span>
        <a class="more-link" href="/docs/index.html">查看全部文档 »</a>
      </div>
      <div id="featured-wiki">
        <!-- 精选文档 挂载点（每行 2 个） -->
      </div>
    </section>

    <!-- 精选留言区块 -->
    <section class="panel">
      <div class="section-title">
        <span>精选留言</span>
        <a class="more-link" href="/guestbook/index.html">查看留言板 »</a>
      </div>
      <div id="featured-guestbook">
        <!-- 精选留言挂载点（复用留言板卡片样式） -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by GitHub Pages
  </footer>

  <!-- 全局共享逻辑 -->
  <script src="/assets/js/common.js"></script>
  <!-- Markdown 渲染 + 消毒（精选留言正文，与留言板一致） -->
  <script src="/assets/vendor/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <!-- 首页专属逻辑（GitHub Profile / 精选文档 / 精选留言） -->
  <script src="/assets/js/home.js"></script>
  <!-- 项目卡片渲染（首页精选项目 & repo 页共享） -->
  <script src="/assets/js/repo.js"></script>
  <!-- Vue 3 本地构建（同 unpkg vue@3 vue.global.js） -->
  <script src="/assets/vendor/vue.global.js"></script>
  <script>
    /* GitHub Octicon SVG */
    var ICON_REPO = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.48 2.48 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>';
    var ICON_LOCATION = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="m12.596 11.614-.01-.01-.011-.01a4.866 4.866 0 0 0-.119-.116 5.75 5.75 0 0 0-7.756-7.756 4.866 4.866 0 0 0-.116.119l-.01.011-.01.01L0 14.25l3.614-3.614Z"/></svg>';
    var ICON_ORG = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M1.75 16A1.75 1.75 0 0 1 0 14.25V1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16Zm-1.75-1.75v-1.5h16v1.5a.25.25 0 0 1-.25.25H1.75a.25.25 0 0 1-.25-.25ZM1.75 1.5a.25.25 0 0 0-.25.25v9h14v-9a.25.25 0 0 0-.25-.25ZM8 4a2 2 0 1 1-2 2 2 2 0 0 1 2-2ZM4 8.5A1.5 1.5 0 0 1 5.5 7h5a1.5 1.5 0 0 1 1.5 1.5v.5H4Z"/></svg>';
    var ICON_PEOPLE = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M2 5.5a3.5 3.5 0 1 1 5.898 2.549 5.498 5.498 0 0 1 3.034-.367 3.5 3.5 0 1 1-1.066 2.18 3.5 3.5 0 0 0-2.47-.46A3.5 3.5 0 0 1 2 5.5ZM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>';

    /* 个人信息加载 */
    fetchGitHubProfile().then(function (p) {
      document.getElementById("profile-name").textContent = p.name;
      document.getElementById("profile-bio").textContent = p.bio || "";
      var meta = [];
      if (p.company) meta.push(ICON_ORG + " " + p.company);
      if (p.location) meta.push(ICON_LOCATION + " " + p.location);
      if (p.public_repos) meta.push(ICON_REPO + " " + p.public_repos + " repos");
      if (p.followers) meta.push(ICON_PEOPLE + " " + p.followers + " followers");
      document.getElementById("profile-meta").innerHTML =
        meta.map(function (t) { return "<span>" + t + "</span>"; }).join("");
      if (p.avatar) {
        var av = document.getElementById("profile-avatar");
        av.src = p.avatar;
      }
    });

    /* 精选项目：从 /repo/star.json 加载，每行 2 个，简介 / star / 技术栈由 GitHub API enrich */
    fetchStarProjects().then(function (list) {
      mountProjectGrid("#featured-projects", list.slice(0, 2), 2, {
        primary: "访问主页",
        secondary: "项目源码"
      });
    });

    /* 精选文档：从 /docs/star.json 加载，每行 2 个，点击查看直接跳转对应 url */
    fetchStarDocs().then(function (list) {
      mountWikiCards("#featured-wiki", list, 2);
    });

    /* 精选留言：从 /guestbook/star.json 加载链接，按链接拉取 issue comment 渲染 */
    fetchStarGuestbook().then(function (list) {
      mountGuestbookCards("#featured-guestbook", list);
    });
  </script>
</body>
</html>
