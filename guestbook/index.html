<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ckckh2023 - 留言</title>
  <meta name="description" content="ckckh2023 的留言板 - 访客留言墙，支持 Markdown">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/guestbook.css">
  <link rel="icon" type="image/jpeg" href="/assets/icons/head.jpg">
  <link rel="canonical" href="https://xiao-blog.top/guestbook/">
  <meta property="og:site_name" content="ckckh2023">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="ckckh2023 - 留言板">
  <meta property="og:description" content="ckckh2023 的留言板 - 访客留言墙，支持 Markdown">
  <meta property="og:url" content="https://xiao-blog.top/guestbook/">
  <meta property="og:image" content="https://xiao-blog.top/assets/icons/head.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ckckh2023 - 留言板">
  <meta name="twitter:description" content="ckckh2023 的留言板 - 访客留言墙，支持 Markdown">
  <meta name="twitter:image" content="https://xiao-blog.top/assets/icons/head.jpg">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container">
    <div class="section-title">
      <span>留言板</span>
      <a class="more-link" href="/">« 返回首页</a>
    </div>

    <!-- 留言发布入口 -->
    <section class="panel">
      <div class="section-title">
        <span>写下你的留言</span>
      </div>
      <form id="guestbook-form" class="gb-form">
        <div class="gb-form-box">
          <div class="gb-form-side">
            <input id="gb-input-name" class="gb-input" type="text" maxlength="32"
                   placeholder="昵称 *" required autocomplete="off">
            <input id="gb-input-qq" class="gb-input" type="text" inputmode="numeric"
                   maxlength="11" placeholder="QQ" autocomplete="off">
            <div class="gb-md-badge">
              <svg class="gb-md-icon" viewBox="0 0 24 24" width="30" height="24"
                   aria-hidden="true" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="2.5"/>
                <path d="M6.5 15V9.5l2.5 2.5 2.5-2.5V15"/>
                <path d="M17 9v4M14 11l3 3 3-3"/>
              </svg>
              <span>支持 Markdown</span>
            </div>
          </div>
          <div class="gb-form-main">
            <div class="gb-toolbar" role="toolbar" aria-label="Markdown 编辑工具栏">
              <button type="button" class="gb-tool" data-md="h1" title="添加页眉文本" aria-label="添加页眉文本">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 4v16M19 4v16M5 12h14"/>
                </svg>
              </button>
              <button type="button" class="gb-tool" data-md="bold" title="添加粗体文本" aria-label="添加粗体文本">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
                  <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
                </svg>
              </button>
              <button type="button" class="gb-tool" data-md="italic" title="添加斜体文本" aria-label="添加斜体文本">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 4h-9M14 20H5M15 4 9 20"/>
                </svg>
              </button>
              <button type="button" class="gb-tool" data-md="quote" title="插入引用" aria-label="插入引用">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 5v14M7 9h11M7 14h7"/>
                </svg>
              </button>
              <button type="button" class="gb-tool" data-md="code" title="插入代码" aria-label="插入代码">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>
                </svg>
              </button>
              <button type="button" class="gb-tool" data-md="link" title="添加链接" aria-label="添加链接">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71a5 5 0 0 0-1.5 3.34"/>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71a5 5 0 0 0 1.5-3.34"/>
                </svg>
              </button>
            </div>
            <textarea id="gb-input-body" class="gb-textarea" rows="6" maxlength="2000"
                      placeholder="留言内容 *" required></textarea>
          </div>
        </div>
        <div class="gb-form-foot">
          <span id="gb-form-hint" class="gb-form-hint"></span>
          <div class="gb-form-actions">
            <button id="gb-preview" class="btn" type="button">预览留言</button>
            <button id="gb-submit" class="btn btn-primary" type="submit">发布留言</button>
          </div>
        </div>
      </form>
    </section>

    <!-- 留言墙 -->
    <section class="panel">
      <div class="section-title">
        <div class="title-left">
          <span>全部留言</span>
          <div id="gb-search"></div>
        </div>
        <button class="btn" id="guestbook-refresh" type="button" aria-label="刷新留言" title="刷新留言">
          <svg class="gb-refresh-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
      </div>
      <div id="guestbook-wall">
        <div class="status-box">加载中…</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by Cloudflare Pages
  </footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/vendor/marked-14.1.4.min.js"></script>
  <script src="/assets/vendor/dompurify-3.1.6.min.js"></script>
  <script src="/assets/js/gb-card.js"></script>
  <script src="/assets/js/guestbook.js"></script>
</body>
</html>
