<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ckckh2023 - 好友</title>
  <meta name="description" content="ckckh2023 的好友列表">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/friend.css">
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/ckckh2023">
  <link rel="canonical" href="https://xiao-blog.top/friend/index.html">
  <meta property="og:site_name" content="ckckh2023">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="ckckh2023 - 好友">
  <meta property="og:description" content="ckckh2023 的好友列表">
  <meta property="og:url" content="https://xiao-blog.top/friend/index.html">
  <meta property="og:image" content="https://avatars.githubusercontent.com/ckckh2023">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ckckh2023 - 好友">
  <meta name="twitter:description" content="ckckh2023 的好友列表">
  <meta name="twitter:image" content="https://avatars.githubusercontent.com/ckckh2023">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container wide">
    <div class="section-title">
      <span>开发者好友</span>
      <div class="title-right">
        <div id="friend-search"></div>
        <a class="more-link" href="/index.html">« 返回首页</a>
      </div>
    </div>

    <div id="all-friends">
      <!-- 好友卡片挂载点（每行 2 个） -->
    </div>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by GitHub Pages
  </footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/friend.js"></script>
  <script>
    /* 全部好友：从 /friend/FriendList.json 加载，复用首页卡片设计，每行 2 个；
       头像缺失时以 ID 首字母占位，点击右下角"访问主页"跳转好友主页；
       搜索框对 ID / 简介实时过滤 */
    var allFriends = [];

    function matchFriend(it, q) {
      if (!q) return true;
      var fields = [it.id, it.bio];
      for (var i = 0; i < fields.length; i++) {
        if (fields[i] && String(fields[i]).toLowerCase().indexOf(q) !== -1) return true;
      }
      return false;
    }

    function renderFriends(list, hasQuery) {
      var box = document.getElementById("all-friends");
      if (!list.length) {
        box.innerHTML = '<div class="status-box">' +
          (hasQuery ? "未找到匹配的好友。" : "暂无好友。") + "</div>";
        return;
      }
      mountFriendGrid("#all-friends", list, 2);
    }

    fetchFriendList().then(function (list) {
      allFriends = list;
      renderFriends(allFriends, false);
      mountSearchBox("#friend-search", {
        placeholder: "搜索好友…",
        onQuery: function (q) {
          renderFriends(allFriends.filter(function (it) { return matchFriend(it, q); }), !!q);
        }
      });
    });
  </script>
</body>
</html>
