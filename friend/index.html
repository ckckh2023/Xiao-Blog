<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ckckh2023 - 好友</title>
  <meta name="description" content="ckckh2023 的好友列表">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/friend.css">
  <link rel="icon" type="image/jpeg" href="/assets/icons/head.jpg">
  <link rel="canonical" href="https://xiao-blog.top/friend/">
  <meta property="og:site_name" content="ckckh2023">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="ckckh2023 - 好友">
  <meta property="og:description" content="ckckh2023 的好友列表">
  <meta property="og:url" content="https://xiao-blog.top/friend/">
  <meta property="og:image" content="https://xiao-blog.top/assets/icons/head.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ckckh2023 - 好友">
  <meta name="twitter:description" content="ckckh2023 的好友列表">
  <meta name="twitter:image" content="https://xiao-blog.top/assets/icons/head.jpg">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container wide">
    <div class="section-title">
      <div class="title-left">
        <span>开发者好友</span>
        <div id="friend-search"></div>
      </div>
      <a class="more-link" href="/">« 返回首页</a>
    </div>

    <div id="all-friends">
      <!-- 好友卡片挂载点 -->
    </div>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by Cloudflare Pages
  </footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/friend.js"></script>
  <script>
    /* 全部好友：从 /friend/FriendList.json 加载 */
    var allFriends = [];
    var friendFiltered = [];
    var friendQuery = "";
    var friendPage = 1;
    var friendPager = null;
    var FRIEND_PAGE_SIZE = 10;

    function matchFriend(it, q) {
      if (!q) return true;
      var ql = q.toLowerCase();
      var fields = [it.id, it.bio];
      for (var i = 0; i < fields.length; i++) {
        if (fields[i] && String(fields[i]).toLowerCase().indexOf(ql) !== -1) return true;
      }
      return false;
    }

    function applyFriends() {
      var box = document.getElementById("all-friends");
      var q = friendQuery;
      friendFiltered = allFriends.filter(function (it) { return matchFriend(it, q); });
      if (!friendFiltered.length) {
        box.innerHTML = '<div class="status-box">' + (q ? "未找到匹配的好友。" : "暂无好友。") + "</div>";
        if (friendPager) { friendPager.destroy(); }
        return;
      }
      var pages = Math.ceil(friendFiltered.length / FRIEND_PAGE_SIZE);
      if (friendPage > pages) friendPage = 1;
      var start = (friendPage - 1) * FRIEND_PAGE_SIZE;
      mountFriendGrid("#all-friends", friendFiltered.slice(start, start + FRIEND_PAGE_SIZE), 2, q);

      var holder = ensurePaginationHolder("#all-friends", "friend-pagination");
      if (!holder) return;
      if (pages > 1) {
        if (!friendPager) {
          friendPager = mountPagination("#friend-pagination", {
            total: friendFiltered.length,
            pageSize: FRIEND_PAGE_SIZE,
            current: friendPage,
            scrollAnchor: "#all-friends",
            onChange: function (p) { friendPage = p; applyFriends(); }
          });
        } else {
          friendPager.setCurrent(friendPage, friendFiltered.length);
        }
      } else if (friendPager) {
        friendPager.destroy();
      }
    }

    fetchFriendList().then(function (list) {
      allFriends = list;
      applyFriends();
      mountSearchBox("#friend-search", {
        placeholder: "搜索好友…",
        onQuery: function (q) { friendQuery = q; friendPage = 1; applyFriends(); }
      });
    });
  </script>
</body>
</html>
