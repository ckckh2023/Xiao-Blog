<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ckckh2023 - 分享</title>
  <meta name="description" content="ckckh2023 的星标分享库">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/share.css">
  <link rel="icon" type="image/png" href="/assets/icons/head.jpg">
  <link rel="canonical" href="https://xiao-blog.top/share/index.html">
  <meta property="og:site_name" content="ckckh2023">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="ckckh2023 - 星标分享库">
  <meta property="og:description" content="ckckh2023 的星标分享库">
  <meta property="og:url" content="https://xiao-blog.top/share/index.html">
  <meta property="og:image" content="https://xiao-blog.top/assets/icons/head.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ckckh2023 - 星标分享库">
  <meta name="twitter:description" content="ckckh2023 的星标分享库">
  <meta name="twitter:image" content="https://xiao-blog.top/assets/icons/head.jpg">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container wide">
    <div class="section-title">
      <div class="title-left">
        <span>星标分享库</span>
        <div id="share-search"></div>
      </div>
      <a class="more-link" href="/index.html">« 返回首页</a>
    </div>

    <div class="share-layout">
      <!-- 左侧栏：分类切换 + 标签筛选 -->
      <aside class="share-sidebar">
        <div class="share-sidebar-title">分类</div>
        <div class="share-toggle" id="share-toggle">
          <span class="share-toggle-indicator" id="share-toggle-indicator"></span>
          <button class="share-toggle-btn active" type="button" data-cat="software">软件</button>
          <button class="share-toggle-btn" type="button" data-cat="other">其他</button>
        </div>

        <div class="share-sidebar-title">标签</div>
        <div class="share-tags-info" id="share-tags-info"></div>
        <div class="share-tags" id="share-tags">
          <div class="share-tags-empty">暂无标签</div>
        </div>
      </aside>

      <!-- 右侧：卡片网格 -->
      <div class="share-content">
        <div id="all-shares">
          <div class="status-box">加载中…</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by Cloudflare Pages
  </footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/share.js"></script>
  <script>
    /* 软件列表：/share/SoftWareList.json；其他列表：/share/OtherList.json
       分类切换条直接切换数据源（不再依赖 item.category 字段）。
       筛选链路：分类(software/other) → 标签 → 搜索框，三级叠加。
       搜索仅作用于当前分类的数据集（符合直觉：在"软件"下搜只搜软件）。
       侧边栏标签由当前分类下的项目聚合（按频次降序）。 */
    var softwareList = [];
    var otherList = [];
    var loadedState = {};  /* 已加载完成的分类：software / other */
    var loadingState = {}; /* 加载中的 Promise，防止重复请求 */
    var filterState = { category: "software", tags: [], query: "" };

    function loadCategory(cat) {
      return cat === "other" ? fetchOtherList() : fetchShareList();
    }

    /* 确保某分类数据已加载：software 只拉 SoftWareList.json，other 只拉 OtherList.json */
    function ensureLoaded(cat) {
      if (loadedState[cat]) return Promise.resolve();
      if (!loadingState[cat]) {
        loadingState[cat] = loadCategory(cat).then(function (list) {
          if (cat === "other") otherList = list;
          else softwareList = list;
          loadedState[cat] = true;
        });
      }
      return loadingState[cat];
    }

    function getCurrentList() {
      return filterState.category === "other" ? otherList : softwareList;
    }

    function matchShare(it, q) {
      var fields = [it.id, it.name, it.description];
      if (Array.isArray(it.tags)) fields = fields.concat(it.tags);
      for (var i = 0; i < fields.length; i++) {
        if (fields[i] && String(fields[i]).toLowerCase().indexOf(q) !== -1) return true;
      }
      return false;
    }

    /* 聚合标签：统计频次，按频次降序（同频按字母序） */
    function collectTags(list) {
      var map = {};
      list.forEach(function (it) {
        if (Array.isArray(it.tags)) {
          it.tags.forEach(function (t) { map[t] = (map[t] || 0) + 1; });
        }
      });
      return Object.keys(map).map(function (k) {
        return { tag: k, count: map[k] };
      }).sort(function (a, b) {
        return b.count - a.count || a.tag.localeCompare(b.tag);
      });
    }

    function renderTagList() {
      var tags = collectTags(getCurrentList());
      var box = document.getElementById("share-tags");
      var info = document.getElementById("share-tags-info");
      if (filterState.tags.length) {
        info.innerHTML = '<span>已选 ' + filterState.tags.length + ' 个</span>' +
          '<button type="button" class="share-tags-clear" id="share-tags-clear">清空</button>';
        info.classList.add("visible");
      } else {
        info.innerHTML = "";
        info.classList.remove("visible");
      }
      if (!tags.length) {
        box.innerHTML = '<div class="share-tags-empty">暂无标签</div>';
        return;
      }
      box.innerHTML = tags.map(function (t) {
        var active = filterState.tags.indexOf(t.tag) !== -1 ? " active" : "";
        return '<button class="share-tag-btn' + active + '" type="button" data-tag="' +
          Utils.escapeHTML(t.tag) + '">' + Utils.escapeHTML(t.tag) + "</button>";
      }).join("");
    }

    /* 应用三级筛选并渲染卡片 */
    function applyFilter() {
      var list = getCurrentList().slice();
      if (filterState.tags.length) {
        list = list.filter(function (it) {
          if (!Array.isArray(it.tags)) return false;
          return filterState.tags.every(function (t) {
            return it.tags.indexOf(t) !== -1;
          });
        });
      }
      if (filterState.query) {
        list = list.filter(function (it) { return matchShare(it, filterState.query); });
      }
      var box = document.getElementById("all-shares");
      if (!list.length) {
        box.innerHTML = '<div class="status-box">' +
          (filterState.tags.length || filterState.query ? "未找到匹配的项目。" : "暂无分享。") +
          "</div>";
        return;
      }
      mountShareGrid("#all-shares", list, 2);
    }

    /* URL 双映射同步：type 控制分类，name 控制搜索词。
       切换分类 / 搜索均用 replaceState 静默同步地址栏，便于分享与刷新保持状态。 */
    function syncURL() {
      var params = new URLSearchParams();
      params.set("type", filterState.category);
      if (filterState.query) params.set("name", filterState.query);
      history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash);
    }
    function applyCategoryUI() {
      document.querySelectorAll(".share-toggle-btn").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-cat") === filterState.category);
      });
      var indicator = document.getElementById("share-toggle-indicator");
      if (indicator) indicator.classList.toggle("right", filterState.category === "other");
    }

    /* 分类切换条：切换到未加载过的分类时才请求对应 JSON */
    document.getElementById("share-toggle").addEventListener("click", function (e) {
      var btn = e.target.closest(".share-toggle-btn");
      if (!btn) return;
      var cat = btn.getAttribute("data-cat");
      if (cat === filterState.category) return;
      filterState.category = cat;
      filterState.tags = []; /* 切换分类时重置已选标签 */
      applyCategoryUI();
      syncURL();
      document.getElementById("all-shares").innerHTML = '<div class="status-box">加载中…</div>';
      ensureLoaded(cat).then(function () {
        renderTagList();
        applyFilter();
      });
    });

    /* 标签点击：多选切换（加入/移除已选数组） */
    document.getElementById("share-tags").addEventListener("click", function (e) {
      var btn = e.target.closest(".share-tag-btn");
      if (!btn) return;
      var tag = btn.getAttribute("data-tag");
      var idx = filterState.tags.indexOf(tag);
      if (idx === -1) filterState.tags.push(tag);
      else filterState.tags.splice(idx, 1);
      renderTagList();
      applyFilter();
    });

    /* 清空已选标签 */
    document.getElementById("share-tags-info").addEventListener("click", function (e) {
      if (e.target.id !== "share-tags-clear") return;
      filterState.tags = [];
      renderTagList();
      applyFilter();
    });

    /* 按需加载当前分类数据源即可，另一分类在切换时才请求。
       URL 双映射：?type=software|other 切换分类，&name=xxx 预填搜索词。
       例如 /share/?type=software&name=db-browser-sqlite 进入即在软件分类下搜索。
       初始访问 /share/ 会静默补全为 ?type=software，便于后续切换地址可辨。 */
    var params = new URLSearchParams(location.search);
    var initType = params.get("type");
    var initName = (params.get("name") || "").trim();
    if (initType === "software" || initType === "other") filterState.category = initType;
    if (initName) filterState.query = initName;
    applyCategoryUI();
    ensureLoaded(filterState.category).then(function () {
      renderTagList();
      applyFilter();
      var search = mountSearchBox("#share-search", {
        placeholder: "搜索工具…",
        onQuery: function (q) {
          filterState.query = q;
          applyFilter();
          syncURL();
        }
      });
      if (initName && search) search.setQuery(initName);
      syncURL();
    });
  </script>
</body>
</html>
