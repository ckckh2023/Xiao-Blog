<body>
  <header id="site-nav"></header>

  <main class="container wide">
    <div class="section-title">
      <div class="title-left">
        <span>全部项目</span>
        <div id="repo-search"></div>
      </div>
      <a class="more-link" href="/">« 返回首页</a>
    </div>

    <div id="all-projects">
      <!-- 项目卡片挂载点 -->
    </div>
  </main>

  <!-- 页尾允许改动，但需保留 ckckh2023 著作权，删去则代表你违反本项目协议 -->
  <footer class="site-footer">
    © <span id="year"></span> ckckh2023 · Powered by <a class="footer-repo-link" href="https://github.com/ckckh2023/Xiao-Blog" target="_blank" rel="noopener noreferrer">Xiao-Blog</a>
  </footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/repo.js"></script>
  <script src="/assets/vendor/vue-3.5.41.runtime.global.js"></script>
  <script>
    /* 全部项目：从 /repo/RepoList.json 加载，由本地内容与 GitHub API 获取 */
    var repoGridCtrl = null;
    fetchRepoList().then(function (list) {
      repoGridCtrl = mountProjectGrid("#all-projects", list, 2);
      mountSearchBox("#repo-search", {
        placeholder: "搜索项目…",
        onQuery: function (q) { if (repoGridCtrl) repoGridCtrl.setQuery(q); }
      });
    });
  </script>
</body>
